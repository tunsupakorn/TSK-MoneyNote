<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>วิธีใช้งานจุกจิก</title>
  <meta name="description" content="คู่มือใช้งานจุกจิก JukJik แอปจดรายรับรายจ่าย อ่านสลิป ใบแจ้งยอดบัตรเครดิต งบประมาณ และซิงก์หลายเครื่อง">
  <meta name="theme-color" content="#FFC83D">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { var t = JSON.parse(localStorage.getItem('jj_prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    .g-top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: max(10px, env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; gap: 10px; }
    .g-top a.icon-btn { display: grid; place-items: center; text-decoration: none; color: var(--text); flex: none; }
    .g-top h1 { font-size: 1.2rem; }
    .g-hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px; color: #2B2118;
      background: radial-gradient(120% 140% at 100% 0%, #FFE58A 0%, #FFC83D 45%, #FFB000 100%); box-shadow: 0 12px 32px rgba(255,170,0,.25); }
    .g-hero small { opacity: .8; }
    .g-hero h2 { font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.25; margin: 2px 0 6px; max-width: 70%; }
    .g-hero p { margin: 0; max-width: 68%; font-size: .92rem; }
    .g-hero img { position: absolute; right: -8px; bottom: -10px; width: 120px; height: 120px; border-radius: 30px; transform: rotate(10deg); }
    .g-search { margin-top: 14px; }
    .g-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
    .g-cat { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
    .g-cat:hover { border-color: var(--accent-2); }
    .g-cat span { font-size: 1.5rem; }
    .g-cat b { font-family: var(--display); font-weight: 500; }
    .g-cat small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .g-sec { margin-top: 26px; scroll-margin-top: 70px; }
    .g-sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .g-sec-head span { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 1.4rem; flex: none; }
    .g-sec-head h2 { font-size: 1.15rem; }
    .g-sec-head small { display: block; color: var(--muted); font-size: .82rem; }
    .g-list { display: grid; gap: 8px; }
    .g-item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; scroll-margin-top: 70px; }
    .g-item summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--text); margin: 0; }
    .g-item summary::-webkit-details-marker { display: none; }
    .g-item summary::after { content: '›'; margin-left: auto; font-size: 1.3rem; color: var(--muted); transition: transform .2s; }
    .g-item[open] summary::after { transform: rotate(90deg); }
    .g-item[open] { border-color: var(--accent-2); }
    .g-body { padding: 0 14px 14px; color: var(--text-2); font-size: .94rem; }
    .g-body p { margin: 0 0 8px; }
    .g-steps { counter-reset: s; list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 8px; }
    .g-steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; }
    .g-steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
      font-weight: 600; font-size: .8rem; display: grid; place-items: center; margin-top: 1px; }
    .g-tip { background: var(--surface-2); border-radius: 12px; padding: 9px 12px; font-size: .88rem; margin-top: 8px; }
    .g-body b { color: var(--text); font-weight: 500; }
    .g-body kbd { font-family: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .85em; white-space: nowrap; }
    .g-copy { margin-left: auto; font-size: .78rem; }
    .g-empty { text-align: center; color: var(--muted); padding: 30px 10px; }
    .g-cta { margin-top: 26px; text-align: center; }
    mark { background: rgba(255, 200, 61, .45); color: inherit; border-radius: 3px; }
  </style>
</head>
<body class="no-nav">
  <main class="app">
    <header class="g-top">
      <a class="icon-btn" href="./" aria-label="กลับไปที่แอป">‹</a>
      <h1>วิธีใช้งาน</h1>
    </header>

    <section class="g-hero">
      <small>คู่มือจุกจิก</small>
      <h2>จุกจิกทำอะไรได้บ้าง?</h2>
      <p>อ่านสลิป จดบัตรเครดิต ตั้งงบ ดูสรุป และซิงก์ทุกเครื่อง ครบในแอปเดียว</p>
      <img src="icons/icon.svg" alt="">
    </section>

    <label class="search g-search"><span aria-hidden="true">🔍</span>
      <input type="search" id="q" placeholder="ค้นหาวิธีใช้ เช่น สลิป, งบ, ซิงก์" autocomplete="off"></label>

    <nav class="g-cats" id="cats" aria-label="หมวดคู่มือ"></nav>
    <div id="sections"></div>
    <p class="g-empty" id="empty" hidden>ไม่พบหัวข้อที่ค้นหา ลองใช้คำอื่นดูนะ</p>

    <section class="g-cta">
      <a class="btn primary big" href="./">กลับไปจดเลย 🐣</a>
    </section>
    <p class="center muted small pad">จุกจิก JukJik</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  { id: 'start', icon: '🐣', title: 'เริ่มใช้จุกจิก', sub: 'สมัคร ล็อกอิน และเริ่มจด', items: [

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = html => html.replace(/<[^>]+>/g, ' ');

function itemHTML(it) {
  const body = (it.steps ? `<ol class="g-steps">${it.steps.map(s => `<li><span>${s}</span></li>`).join('')}</ol>` : '')
    + (it.body || '') + (it.tip ? `<p class="g-tip">💡 ${it.tip}</p>` : '');
  return `<details class="g-item" id="${it.id}"><summary>${it.q}</summary><div class="g-body">${body}
    <button class="link g-copy" data-copy="${it.id}">🔗 คัดลอกลิงก์หัวข้อนี้</button></div></details>`;
}

function render(q = '') {
  const needle = q.trim().toLowerCase();
  const match = it => !needle || (it.q + ' ' + strip(it.body || '') + ' ' + (it.steps || []).map(strip).join(' ') + ' ' + (it.tip || '')).toLowerCase().includes(needle);
  let any = false;
  $('#sections').innerHTML = GUIDE.map(sec => {
    const items = sec.items.filter(match);
    if (!items.length) return '';
    any = true;
    return `<section class="g-sec" id="sec-${sec.id}">
      <div class="g-sec-head"><span aria-hidden="true">${sec.icon}</span><div><h2>${sec.title}</h2><small>${sec.sub}</small></div></div>
      <div class="g-list">${items.map(itemHTML).join('')}</div></section>`;
  }).join('');
  $('#empty').hidden = any;
  $('#cats').hidden = !!needle;
  if (needle) document.querySelectorAll('.g-item').forEach(d => d.open = true);
}

$('#cats').innerHTML = GUIDE.map(s => `<a class="g-cat" href="#sec-${s.id}"><span aria-hidden="true">${s.icon}</span><b>${s.title}</b><small>${s.sub}</small></a>`).join('');
render();
$('#q').addEventListener('input', e => render(e.target.value));

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const url = location.href.split('#')[0] + '#' + b.dataset.copy;
  const done = () => { const t = $('#toast'); t.textContent = 'คัดลอกลิงก์แล้ว'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); };
  (navigator.clipboard?.writeText(url) || Promise.reject()).then(done).catch(() => { prompt('คัดลอกลิงก์นี้', url); });
});

// open a topic from a #link
function openHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const el = id && document.getElementById(id);
  if (el && el.tagName === 'DETAILS') { el.open = true; setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
}
window.addEventListener('hashchange', openHash);
openHash();
